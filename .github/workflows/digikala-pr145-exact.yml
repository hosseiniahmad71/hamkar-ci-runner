name: DigiKala PR145 exact SHA engineering checks
on:
  push:
    branches: ['ci/dk145-f985ca77-20261020']
permissions:
  contents: read
jobs:
  digikala:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hosseiniahmad71/Hamkar-erp
          ref: 'd52b723d39d3b32126d2c684709a95de95abcefd'
          token: ${{ secrets.HAMKAR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: source
      - name: Verify immutable source
        run: |
          test "$(git -C source rev-parse HEAD)" = "d52b723d39d3b32126d2c684709a95de95abcefd"
          git -C source remote remove origin
          echo "TARGET_SHA=d52b723d39d3b32126d2c684709a95de95abcefd"
          echo "OPERATIONAL_GATES=0/7_NOT_PROVEN PHASE3=PARTIAL DEPLOYMENT=DO_NOT_DEPLOY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install engineering dependencies
        working-directory: source/prototypes/mobile-workbench-v4
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r preview-api/requirements.txt >"$RUNNER_TEMP/pip.log" 2>&1 || { echo "Python dependency installation failed; private log withheld"; exit 1; }
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/npm.log" 2>&1 || { echo "Frontend dependency installation failed; private log withheld"; exit 1; }
          npx playwright install --with-deps chromium >"$RUNNER_TEMP/chromium.log" 2>&1 || { echo "Chromium installation failed; private log withheld"; exit 1; }
      - name: Run isolated checks without publishing private source
        working-directory: source/prototypes/mobile-workbench-v4
        shell: bash
        run: |
          set +e
          set -uo pipefail
          result=0
          check() {
            label="$1"; shift
            "$@" >"$RUNNER_TEMP/$label.log" 2>&1
            code=$?
            if [ "$code" = 0 ]; then echo "$label=PASS"; else echo "$label=FAIL private log withheld"; result=1; fi
            python - "$RUNNER_TEMP/$label.log" <<'PY'
          import re,sys
          text=open(sys.argv[1]).read()
          for pattern in (r"\b(\d+) passed", r"Test Files\s+(\d+) passed", r"Tests\s+(\d+) passed"):
              values=re.findall(pattern,text)
              if values: print("verified_summary="+pattern+" counts="+",".join(values))
          PY
          }
          check pytest bash -c 'cd preview-api && python -m pytest -q test_digikala_staged_detail.py test_digikala_detail_projection.py test_digikala_catalog_read.py test_storefront.py'
          check vitest npm test -- --reporter=dot
          check build npm run build
          check browser bash -c 'rm -f evidence/digikala-*.png; npx playwright test --config playwright.digikala.config.ts digikala-catalog.spec.ts --reporter=json >"$RUNNER_TEMP/browser-results.json"'
          echo "OPERATIONAL_GATES=0/7_NOT_PROVEN PHASE3=PARTIAL DEPLOYMENT=DO_NOT_DEPLOY"
          exit "$result"

      - name: Synthetic browser verdicts only
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'browser-results.json'
          if not p.exists(): print('browser_summary=NO_REPORT'); raise SystemExit(0)
          try: data=json.loads(p.read_text())
          except ValueError: print('browser_summary=INVALID_REPORT'); raise SystemExit(0)
          print('browser_statistics='+json.dumps(data.get('stats',{})))
          def walk(suite):
              for spec in suite.get('specs',[]):
                  for test in spec.get('tests',[]):
                      for result in test.get('results',[]):
                          if result.get('status') not in ('passed','skipped'):
                              print('synthetic_failed_case='+spec.get('title',''))
                              for error in result.get('errors',[]):
                                  clean=re.sub(r'\x1b\\[[0-9;]*m','',error.get('message',''))
                                  for line in clean.splitlines():
                                      if re.match(r'^\\s*(Error:|Expected:|Received:|Timeout:|Locator:)',line): print(line[:400])
              for child in suite.get('suites',[]):walk(child)
          for suite in data.get('suites',[]):walk(suite)
          PY
      - name: Synthetic UI screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-digikala-viewports
          path: source/prototypes/mobile-workbench-v4/evidence/digikala-*.png
          if-no-files-found: ignore
