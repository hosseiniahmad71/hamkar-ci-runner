name: HamKar PR145 committed package exact-SHA preflight
on:
  push:
    branches:
      - ci/dk145-owner-brand-phone-build-20261022
permissions:
  contents: read
jobs:
  verify-committed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable package target
        uses: actions/checkout@v4
        with:
          repository: hosseiniahmad71/Hamkar-erp
          ref: 6db61c169a63cda33520d4df6c7b11f988cb27d6
          token: ${{ secrets.HAMKAR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Verify exact checkout and remove remote
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "6db61c169a63cda33520d4df6c7b11f988cb27d6"
          git -C source remote remove origin
          echo 'EXACT_CHECKOUT=PASS'
      - name: Run existing exact-target updater preflight without running updater
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, runpy, subprocess
          from pathlib import Path
          source='4d4af21e7e180401705dffd9c57e18589e1af104'
          target='6db61c169a63cda33520d4df6c7b11f988cb27d6'
          diff=subprocess.check_output(['git','diff','--name-only',source,target],text=True).splitlines()
          assert set(diff)=={'prototypes/mobile-workbench-v4/phone-web.json','prototypes/mobile-workbench-v4/phone-web.tar.gz'},diff
          manifest=json.loads(Path('prototypes/mobile-workbench-v4/phone-web.json').read_text())
          assert len(manifest['inputs'])==146
          assert len(manifest['files'])==49
          actual_source=runpy.run_path('prototypes/mobile-workbench-v4/scripts/basalam-current-update.py')['verify_target_web'](target)
          assert actual_source==source
          print('EXACT_COMMIT_TARGET_PREFLIGHT=PASS')
          print('ARCHIVE_SHA256='+manifest['archive_sha256'])
          print('FRONTEND_INPUTS=146 ARCHIVE_MEMBERS=49')
          print('NO_INSTALL_NO_PROVIDER_IO=true')
          PY
      - name: Governance boundaries
        if: always()
        run: |
          echo 'OPERATIONAL_GATES=0/7_NOT_PROVEN'
          echo 'PHASE3=PARTIAL DEPLOYMENT=DO_NOT_DEPLOY'
