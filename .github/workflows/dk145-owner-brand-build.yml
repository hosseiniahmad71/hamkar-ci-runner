name: HamKar PR145 compact mobile cards browser-only QA
on:
  push:
    branches:
      - ci/dk145-owner-brand-phone-build-20261022
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hosseiniahmad71/Hamkar-erp
          ref: 5411995c45350248b97d73e6bf947ffc8dcbffb1
          token: ${{ secrets.HAMKAR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: source
      - name: Verify exact private source
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "5411995c45350248b97d73e6bf947ffc8dcbffb1"
          git -C source remote remove origin
          echo 'EXACT_SOURCE=PASS'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only headless Chromium and locked frontend dependencies
        working-directory: source/prototypes/mobile-workbench-v4
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/npm.log" 2>&1 || { echo 'NPM_CI=FAIL'; exit 1; }
          npx playwright install chromium --only-shell >"$RUNNER_TEMP/chromium.log" 2>&1 || { echo 'CHROMIUM_DOWNLOAD=FAIL'; exit 1; }
          echo 'HEADLESS_CHROMIUM_READY=PASS'
      - name: Run small browser suite, no real Provider requests
        working-directory: source/prototypes/mobile-workbench-v4
        run: |
          set -euo pipefail
          rm -f evidence/marketplace-hub-*.png
          npx playwright test --config playwright.hub.config.ts tests/work20-browser/marketplace-hub.spec.ts --reporter=list >"$RUNNER_TEMP/qa.log" 2>&1 || {
             echo 'MOBILE_BROWSER=FAIL'
             grep -E 'failed|Expected:|Received:|Error:' "$RUNNER_TEMP/qa.log" | tail -16 | cut -c1-180 || true
             exit 1
          }
          echo 'MOBILE_BROWSER=PASS'
          grep -E '[0-9]+ passed' "$RUNNER_TEMP/qa.log" | tail -1 || true
      - name: Publish only synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamkar-pr145-compact-synthetic-mobile
          path: source/prototypes/mobile-workbench-v4/evidence/marketplace-hub-*.png
          retention-days: 1
          if-no-files-found: ignore
      - name: Governance
        if: always()
        run: |
          echo 'NO_LIVE_PROVIDER_OR_TERMUX_OPERATION=true'
          echo 'OPERATIONAL_GATES=0/7_NOT_PROVEN PHASE3=PARTIAL DEPLOYMENT=DO_NOT_DEPLOY'
