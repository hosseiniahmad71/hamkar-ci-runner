name: HamKar PR145 owner-brand phone package (exact SHA)
on:
  push:
    branches:
      - ci/dk145-owner-brand-phone-build-20261022

permissions:
  contents: read

jobs:
  build-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable private source without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: hosseiniahmad71/Hamkar-erp
          ref: 4d4af21e7e180401705dffd9c57e18589e1af104
          token: ${{ secrets.HAMKAR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 2
          path: source
      - name: Verify exact source and detach remote
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "4d4af21e7e180401705dffd9c57e18589e1af104"
          git -C source remote remove origin
          echo 'PRIVATE_SOURCE_PIN=VERIFIED'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked frontend dependencies
        working-directory: source/prototypes/mobile-workbench-v4
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/npm-private.log" 2>&1 || {
            echo 'NPM_CI=FAIL (private log withheld)'; exit 1;
          }
          echo 'NPM_CI=PASS'
      - name: Run limited Marketplace Hub tests
        working-directory: source/prototypes/mobile-workbench-v4
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run src/marketplace/MarketplaceHub.test.tsx src/marketplace/provider-entry.test.ts --reporter=dot >"$RUNNER_TEMP/vitest-private.log" 2>&1 || {
            echo 'HUB_VITEST=FAIL (private log withheld)'; exit 1;
          }
          echo 'HUB_VITEST=PASS'
      - name: Build exact-source preview bundle
        working-directory: source/prototypes/mobile-workbench-v4
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-phone-web.py --source-sha 4d4af21e7e180401705dffd9c57e18589e1af104 >"$RUNNER_TEMP/build-private.log" 2>&1 || {
            echo 'PHONE_BUILD=FAIL (private log withheld)'; exit 1;
          }
          echo 'PHONE_BUILD=PASS'
      - name: Commit only manifest and package then run updater preflight locally
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          prefix=prototypes/mobile-workbench-v4
          git add -- "$prefix/phone-web.json" "$prefix/phone-web.tar.gz"
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          test "$(git diff --name-only | wc -l)" -eq 0
          git -c user.name='HamKar CI package' -c user.email='hamkar-ci@users.noreply.github.com' commit -m 'build(phone): owner-brand marketplace update at df5e061'
          test "$(git rev-parse HEAD^)" = "4d4af21e7e180401705dffd9c57e18589e1af104"
          python - <<'PY'
          import hashlib,json,runpy
          from pathlib import Path
          m=json.loads(Path('prototypes/mobile-workbench-v4/phone-web.json').read_text())
          assert m['build_source_sha']=='4d4af21e7e180401705dffd9c57e18589e1af104'
          assert len(m['inputs'])==146, len(m['inputs'])
          assert len(m['files'])>=49, len(m['files'])
          print('FRONTEND_INPUTS='+str(len(m['inputs'])))
          print('ARCHIVE_MEMBERS='+str(len(m['files'])))
          print('ARCHIVE_SHA256='+m['archive_sha256'])
          print('ARCHIVE_BYTES='+str(Path('prototypes/mobile-workbench-v4/phone-web.tar.gz').stat().st_size))
          updater=runpy.run_path('prototypes/mobile-workbench-v4/scripts/basalam-current-update.py')
          updater['verify_target_web'](__import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('EXACT_COMMIT_TARGET_PREFLIGHT=PASS')
          PY
          echo "PACKAGE_COMMIT_SHA=$(git rev-parse HEAD)"
      - name: Encrypt built update for private local delivery
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/encrypted-delivery"
          cat > "$RUNNER_TEMP/recipient-public.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAmxm5+P21fIqz9vTqdsby
          wIE38p3yU6U1o9IY1Ax/kmzHV5/0MLNp7LXIfFwfx9mQBdy0Q3yVAGgzySWdGnBU
          kHM1sra7np7+GgTTmnihDYgQom3p9A5Hvaxbn1jNQwDBNV0eIN4wFkyBojQiT9N9
          SbRLjV3/91VEf3f7FTeAVRCKOGYjROBipHuf829emdCi59POma0WftCKI3OY6P0l
          LJk9NruS6ViL1TB4JCZHjt3KRxS1RoE4n6ECXuaYvPQnIJhcBQQZKpsoUdKr3nt1
          1ruW88O5xU2jTyMBbZbsHdrOYJ0S5mNGnpalE57/KzIWHVmWtA2FBafOZNsnoMjA
          hycN2Sshp+/+i+56VrAuUfyzjMaySobvZ3IbrvqCvflmkzfvAyt1NFhGReitnMtU
          i92zxPNPj5PEJP4tLNC9HUpHTUxfpLRcQmzxmlQAFGCef7CCb150JXF+PK1EqywH
          Qc1bcA7rypHIvmDp1v+hLOc45tQlPSiQETPGFo1QeLvPAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -C prototypes/mobile-workbench-v4 -cf "$RUNNER_TEMP/private-update.tar" phone-web.json phone-web.tar.gz
          openssl rand -base64 32 >"$RUNNER_TEMP/key.pass"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/recipient-public.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/key.pass" -out "$RUNNER_TEMP/encrypted-delivery/key.rsa"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:"$RUNNER_TEMP/key.pass" -in "$RUNNER_TEMP/private-update.tar" -out "$RUNNER_TEMP/encrypted-delivery/private-update.tar.enc"
          echo 'ENCRYPTED_DELIVERY=PASS (no raw source or bundle in public artifact)'
      - uses: actions/upload-artifact@v4
        with:
          name: hamkar-owner-brand-encrypted-update
          path: ${{ runner.temp }}/encrypted-delivery
          if-no-files-found: error
          retention-days: 1
      - name: Report boundaries
        if: always()
        run: |
          echo 'NO_PUBLIC_ARTIFACT_UPLOAD=true'
          echo 'OPERATIONAL_GATES=0/7_NOT_PROVEN'
          echo 'PHASE3=PARTIAL DEPLOYMENT=DO_NOT_DEPLOY'
