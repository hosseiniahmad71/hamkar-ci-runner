name: HamKar PR145 owner-brand phone package (exact SHA)
on:
  push:
    branches:
      - ci/dk145-owner-brand-phone-build-20261022

permissions:
  contents: read

jobs:
  build-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable private source without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: hosseiniahmad71/Hamkar-erp
          ref: df5e061ac41f9a76419f592b516fec2103e4ff65
          token: ${{ secrets.HAMKAR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 2
          path: source
      - name: Verify exact source and detach remote
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "df5e061ac41f9a76419f592b516fec2103e4ff65"
          git -C source remote remove origin
          echo 'PRIVATE_SOURCE_PIN=VERIFIED'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked frontend dependencies
        working-directory: source/prototypes/mobile-workbench-v4
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/npm-private.log" 2>&1 || {
            echo 'NPM_CI=FAIL (private log withheld)'; exit 1;
          }
          echo 'NPM_CI=PASS'
      - name: Run limited Marketplace Hub tests
        working-directory: source/prototypes/mobile-workbench-v4
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run src/marketplace/MarketplaceHub.test.tsx src/marketplace/provider-entry.test.ts --reporter=dot >"$RUNNER_TEMP/vitest-private.log" 2>&1 || {
            echo 'HUB_VITEST=FAIL (private log withheld)'; exit 1;
          }
          echo 'HUB_VITEST=PASS'
      - name: Build exact-source preview bundle
        working-directory: source/prototypes/mobile-workbench-v4
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-phone-web.py --source-sha df5e061ac41f9a76419f592b516fec2103e4ff65 >"$RUNNER_TEMP/build-private.log" 2>&1 || {
            echo 'PHONE_BUILD=FAIL (private log withheld)'; exit 1;
          }
          echo 'PHONE_BUILD=PASS'
      - name: Commit only manifest and package then run updater preflight locally
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          prefix=prototypes/mobile-workbench-v4
          git add -- "$prefix/phone-web.json" "$prefix/phone-web.tar.gz"
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          test "$(git diff --name-only | wc -l)" -eq 0
          git -c user.name='HamKar CI package' -c user.email='hamkar-ci@users.noreply.github.com' commit -m 'build(phone): owner-brand marketplace update at df5e061'
          test "$(git rev-parse HEAD^)" = "df5e061ac41f9a76419f592b516fec2103e4ff65"
          python - <<'PY'
          import hashlib,json,runpy
          from pathlib import Path
          m=json.loads(Path('prototypes/mobile-workbench-v4/phone-web.json').read_text())
          assert m['build_source_sha']=='df5e061ac41f9a76419f592b516fec2103e4ff65'
          assert len(m['inputs'])==146, len(m['inputs'])
          assert len(m['files'])>=49, len(m['files'])
          print('FRONTEND_INPUTS='+str(len(m['inputs'])))
          print('ARCHIVE_MEMBERS='+str(len(m['files'])))
          print('ARCHIVE_SHA256='+m['archive_sha256'])
          print('ARCHIVE_BYTES='+str(Path('prototypes/mobile-workbench-v4/phone-web.tar.gz').stat().st_size))
          updater=runpy.run_path('prototypes/mobile-workbench-v4/scripts/basalam-current-update.py')
          updater['verify_target_web'](__import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('EXACT_COMMIT_TARGET_PREFLIGHT=PASS')
          PY
          echo "PACKAGE_COMMIT_SHA=$(git rev-parse HEAD)"
      - name: Push verified package to existing private feature branch without force
        working-directory: source
        shell: bash
        env:
          HAMKAR_WRITE_TOKEN: ${{ secrets.HAMKAR_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HAMKAR_WRITE_TOKEN"
          auth=$(printf 'x-access-token:%s' "$HAMKAR_WRITE_TOKEN" | base64 -w0)
          git -c credential.helper= -c "http.extraheader=AUTHORIZATION: basic $auth" \
            push https://github.com/hosseiniahmad71/Hamkar-erp.git HEAD:refs/heads/feature/digikala-catalog-responsive-f95-20261020 >/dev/null
          echo 'PRIVATE_BRANCH_PACKAGE_PUSH=PASS'
          echo "TARGET_PACKAGE_COMMIT=$(git rev-parse HEAD)"
      - name: Report boundaries
        if: always()
        run: |
          echo 'NO_PUBLIC_ARTIFACT_UPLOAD=true'
          echo 'OPERATIONAL_GATES=0/7_NOT_PROVEN'
          echo 'PHASE3=PARTIAL DEPLOYMENT=DO_NOT_DEPLOY'
