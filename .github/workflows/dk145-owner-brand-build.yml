name: HamKar PR145 compact card package final target preflight
on:
  push:
    branches:
      - ci/dk145-owner-brand-phone-build-20261022
permissions:
  contents: read
jobs:
  exact-package-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hosseiniahmad71/Hamkar-erp
          ref: 06605e5b03a7f446904f0f918215f2e5ce87ab8c
          token: ${{ secrets.HAMKAR_PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Check exact final commit and remove remote
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "06605e5b03a7f446904f0f918215f2e5ce87ab8c"
          git -C source remote remove origin
          echo 'EXACT_TARGET_CHECKOUT=PASS'
      - name: Verify original updater package gates without installation
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,runpy,json
          from pathlib import Path
          source='5411995c45350248b97d73e6bf947ffc8dcbffb1';target='06605e5b03a7f446904f0f918215f2e5ce87ab8c'
          names=subprocess.check_output(['git','diff','--name-only',source,target],text=True).splitlines()
          assert set(names)=={'prototypes/mobile-workbench-v4/phone-web.json','prototypes/mobile-workbench-v4/phone-web.tar.gz'},names
          manifest=json.loads(Path('prototypes/mobile-workbench-v4/phone-web.json').read_text())
          assert manifest['build_source_sha']==source
          assert len(manifest['inputs'])==149
          assert len(manifest['files'])==52
          verified=runpy.run_path('prototypes/mobile-workbench-v4/scripts/basalam-current-update.py')['verify_target_web'](target)
          assert verified==source
          print('EXACT_COMMIT_TARGET_PREFLIGHT=PASS')
          print('ARCHIVE_SHA256='+manifest['archive_sha256'])
          print('FRONTEND_INPUTS=149 ARCHIVE_MEMBERS=52')
          print('NO_INSTALL_NO_PROVIDER_IO=true')
          PY
      - name: Governance
        if: always()
        run: |
          echo 'OPERATIONAL_GATES=0/7_NOT_PROVEN'
          echo 'PHASE3=PARTIAL DEPLOYMENT=DO_NOT_DEPLOY'
