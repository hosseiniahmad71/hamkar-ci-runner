  phase3-11task-synthetic-convergence:
    name: 605 accepted tests and convergence from private SHA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAMKAR_PROXY_JOB: phase3-11task-synthetic-convergence
