name: One-time removal of exposed private-source artifact
on:
  push:
    branches:
      - 'work/security-delete-exposed-artifact-v1'
permissions:
  actions: write
  contents: read
jobs:
  purge-specific-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify owner, artifact ID and origin before deletion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'hosseiniahmad71/hamkar-ci-runner'
          artifact='repos/hosseiniahmad71/hamkar-ci-runner/actions/artifacts/11686769022'
          metadata="$(gh api "$artifact")"
          printf '%s' "$metadata" | jq -e '
            .id == 11686769022 and
            .name == "hamkar-private-proxy-postgres-artifacts" and
            .workflow_run.id == 38098747520 and
            .workflow_run.repository_id == 1413759530 and
            .expired == false
          ' >/dev/null
          gh api -X DELETE "$artifact" --silent
          if gh api "$artifact" >/dev/null 2>&1; then
            echo 'PURGE_FAIL: exact artifact still accessible'
            exit 1
          fi
          echo 'PURGE_PASS: exact artifact 11686769022 returned 404 after deletion'
