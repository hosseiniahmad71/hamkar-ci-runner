                  step_env[str(key)] = str(value).replace('${{ runner.temp }}', step_env['RUNNER_TEMP'])
              print(f'::group::Synthetic private run step {executed + 1}', flush=True)
              # Launch a private process group. subprocess.run(timeout=...)
              # kills only the shell, potentially leaving child processes alive.
              # No private command text, output or exception goes to public logs.
              proc = subprocess.Popen(step['run'], cwd=root, shell=True,
                                      executable='/bin/bash', env=step_env,
                                      stdout=subprocess.DEVNULL,
                                      stderr=subprocess.DEVNULL,
                                      start_new_session=True)
              try:
                  proc.wait(timeout=limit * 60 if limit is not None else None)
              except subprocess.TimeoutExpired:
                  import signal
                  try:
                      os.killpg(proc.pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass
                  try:
                      proc.wait(timeout=2)
                  except subprocess.TimeoutExpired:
                      pass
                  # SIGTERM may be ignored by descendants even if the shell
                  # already exited. Reap/terminate the entire process group.
                  try:
                      os.killpg(proc.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  proc.wait()
                  raise SystemExit('nested workflow run step timed out') from None
              print('::endgroup::', flush=True)
              if proc.returncode:
                  raise SystemExit(proc.returncode)
              # GitHub does not replay GITHUB_ENV exports between nested
              # run steps executed as subprocesses of this one proxy step.
              # Import only the six non-secret, documented path exports.
              # Apply only bytes appended by this simulated step, not old
              # runner exports. Restrict exports to six local, non-secret paths.
              if github_env_path.is_symlink():
                  raise SystemExit('unsafe nested workflow env file')
              if github_env_path.is_file():
                  current_size = github_env_path.stat().st_size
                  if current_size < env_offset:
                      raise SystemExit('nested workflow env file was truncated')
                  with github_env_path.open('rb') as exports:
                      exports.seek(env_offset)
                      appended = exports.read(8193)
                  if len(appended) > 8192:
                      raise SystemExit('oversized nested workflow env export')
                  env_offset = current_size
                  allowed = {'HAMKAR_PG_DUMP_BIN', 'HAMKAR_PG_RESTORE_BIN',
                             'HAMKAR_TEST_BROWSER', 'HAMKAR_TEST_REACT',
                             'HAMKAR_TEST_REACT_DOM', 'HAMKAR_TEST_UI_ARTIFACTS'}
                  for assignment in appended.decode('utf-8').splitlines():
                      if not assignment:
                          continue
                      key, separator, value = assignment.partition('=')
                      if not separator or key not in allowed:
                          raise SystemExit('unrecognized nested workflow env export')
                      if (len(value) > 4096 or
                              not re.fullmatch(r'/[A-Za-z0-9_./-]+', value)):
                          raise SystemExit('unsafe nested workflow env path')
                      resolved = Path(value).resolve()
                      if key == 'HAMKAR_TEST_BROWSER':
                          if value != '/usr/bin/google-chrome':
                              raise SystemExit('unexpected browser binary path')
                      else:
                          temp_root = Path(env['RUNNER_TEMP']).resolve()
                          if not resolved.is_relative_to(temp_root):
                              raise SystemExit('nested workflow path escapes runner temp')
                          # Reject all symlinks, including directory components
                          # that resolve to another path still inside runner temp.
                          candidate = Path(value)
                          try:
                              relative = candidate.relative_to(Path(env['RUNNER_TEMP']))
                          except ValueError:
                              raise SystemExit('nested workflow path escapes runner temp') from None
                          cursor = Path(env['RUNNER_TEMP'])
                          for component in relative.parts:
                              if component in ('.', '..'):
                                  raise SystemExit('invalid runner temp path component')
                              cursor = cursor / component
                              if cursor.is_symlink():
                                  raise SystemExit('symlink in nested workflow export path')
                      env[key] = str(resolved)
              executed += 1
          print(f'HAMKAR_PROXY_JOB_DONE job={job_name} executed_run_steps={executed} skipped_non_run_steps={skipped}', flush=True)
          PY
          python "$RUNNER_TEMP/run_private_workflow_job.py"
