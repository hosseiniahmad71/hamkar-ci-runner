name: HamKar Phase3 final exact-SHA hardened synthetic proxy

# Isolated push-only test of frozen private SHA; no upload of private artifacts.
on:
  push:
    branches:
      - 'work/phase3-pr61-exact-sha-final-qa-v1'
      - 'work/phase3-fifo-frozen-exact-qa-v1'
      - 'work/phase3-ui-c6-exact-qa-v1'
      - 'work/work15-operational-gate-exact-qa-v1'

permissions:
  contents: read

concurrency:
  group: hamkar-phase3-final-isolated-${{ github.sha }}
  cancel-in-progress: true

jobs:
  postgres-orm-smoke:
    name: PostgreSQL 18, Node and Chromium smoke from private SHA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: hamkar_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: hamkar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hamkar_test -d hamkar_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HAMKAR_PROXY_JOB: postgres-orm-smoke
      HAMKAR_TEST_POSTGRES_URL: postgresql+psycopg://hamkar_test:synthetic_ci_only@127.0.0.1:5432/hamkar_ci
    steps:
      - name: Validate dispatch inputs before private checkout
        env:
          TARGET_SHA_INPUT: e947a60afda84149187ba35b836583fa89eb8f3d
          TARGET_LABEL_INPUT: phase3final
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'REFUSED: target_ref must be a lowercase 40-hex commit SHA'
            exit 2
          fi
          if [[ -n "$TARGET_LABEL_INPUT" && ! "$TARGET_LABEL_INPUT" =~ ^[A-Za-z0-9_.-]{1,64}$ ]]; then
            echo 'REFUSED: target_label contains invalid characters or is too long'
            exit 2
          fi
      - name: Checkout private HamKar ERP at exact SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hosseiniahmad71/Hamkar-erp
          token: ${{ secrets.HAMKAR_PRIVATE_REPO_TOKEN }}
          ref: e947a60afda84149187ba35b836583fa89eb8f3d
          path: hamkar
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact target SHA
        env:
          TARGET_SHA_INPUT: e947a60afda84149187ba35b836583fa89eb8f3d
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA_INPUT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'REFUSED: target_ref must be one exact 40-hex commit SHA'
            exit 2
          fi
          test "$TARGET_SHA_INPUT" = "$(git -C hamkar rev-parse HEAD)"
          git -C hamkar remote remove origin || true
          # No repository-local credential, auth header or token URL rewrite may
          # survive the checkout. Never print an offending value.
          if git -C hamkar config --local --get-regexp '^(http\..*\.extraheader|credential\..*|url\..*\.insteadof)$' >/dev/null 2>&1; then
            echo 'REFUSED: repository-local credential configuration found'
            exit 2
          fi
          echo "TARGET_SHA=$(git -C hamkar rev-parse HEAD)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Execute private workflow run steps for postgres job
        run: |
          set -euo pipefail
          python -m pip install --retries 0 --timeout 10 'PyYAML>=6,<7'
          cat > "$RUNNER_TEMP/run_private_workflow_job.py" <<'PY'
          import os, subprocess, sys
          import re
          from pathlib import Path
          import yaml

          root = Path('hamkar')
          try:
              workflow = yaml.safe_load((root / '.github/workflows/postgres-orm-safety.yml').read_text())
          except yaml.YAMLError:
              raise SystemExit('REFUSED: malformed private workflow YAML') from None
          job_name = os.environ['HAMKAR_PROXY_JOB']
          job = workflow['jobs'][job_name]
          env = os.environ.copy()
          # Never expose workflow/Actions runtime tokens to private scripts.
          for key in list(env):
              if (key.endswith('_TOKEN') or key.startswith('ACTIONS_RUNTIME_')
                      or key.startswith('ACTIONS_ID_TOKEN_') or
                      key in {'GH_TOKEN', 'GITHUB_TOKEN'}):
                  env.pop(key, None)
          approved_job_env = {
              'HAMKAR_TEST_POSTGRES_URL': 'postgresql+psycopg://hamkar_test:synthetic_ci_only@127.0.0.1:5432/hamkar_ci',
              'PYTHONDONTWRITEBYTECODE': '1',
          }
          job_env = job.get('env') or {}
          if not isinstance(job_env, dict):
              raise SystemExit('unsupported private job environment')
          for key, value in job_env.items():
              if approved_job_env.get(key) != str(value):
                  raise SystemExit('unapproved private job environment')
              env[key] = str(value)
          executed = 0
          skipped = 0
          # Isolate nested exports from the real GitHub runner GITHUB_ENV:
          # otherwise private steps could inject variables into post-job actions.
          github_env_path = Path(env['RUNNER_TEMP']) / 'hamkar-proxy-internal-env'
          fd = os.open(github_env_path,
                       os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, 'O_NOFOLLOW', 0),
                       0o600)
          os.close(fd)
          env['GITHUB_ENV'] = str(github_env_path)
          env_offset = 0
          for step in job.get('steps', []):
              name = step.get('name') or step.get('uses') or 'unnamed step'
              if 'run' not in step:
                  action = str(step.get('uses') or '').split('@', 1)[0]
                  if action not in {'actions/checkout', 'actions/setup-python',
                                    'actions/upload-artifact'}:
                      raise SystemExit('unsupported non-run step in private workflow')
                  print(f'::notice title=Proxy skips supported native uses::{action}', flush=True)
                  skipped += 1
                  continue
              if step.get('if') not in (None, 'always()'):
                  raise SystemExit('unsupported conditional run step')
              if any(key in step for key in ('shell', 'working-directory', 'continue-on-error')):
                  raise SystemExit('unsupported run step execution metadata')
              limit = step.get('timeout-minutes')
              if limit is not None and (type(limit) is not int or not 1 <= limit <= 15):
                  raise SystemExit('invalid nested run step timeout')
              step_env = env.copy()
              extra_env = step.get('env') or {}
              if not isinstance(extra_env, dict) or set(extra_env) - {'HAMKAR_CI_EVIDENCE_OUTPUT'}:
                  raise SystemExit('unapproved private step environment')
              for key, value in extra_env.items():
                  step_env[str(key)] = str(value).replace('${{ runner.temp }}', step_env['RUNNER_TEMP'])
              # Evidence must live in a dedicated, operator-owned 0700
              # directory. Never weaken the recovery evidence publisher.
              if 'HAMKAR_CI_EVIDENCE_OUTPUT' in step_env:
                  target_name = Path(step_env['HAMKAR_CI_EVIDENCE_OUTPUT']).name
                  if target_name != 'hamkar-phase3-synthetic-drill-evidence.json':
                      raise SystemExit('unrecognized synthetic evidence output')
                  private_dir = Path(env['RUNNER_TEMP']) / 'hamkar-proxy-private-evidence'
                  private_dir.mkdir(mode=0o700, exist_ok=True)
                  info = private_dir.lstat()
                  import stat
                  if (not stat.S_ISDIR(info.st_mode) or info.st_uid != os.geteuid()
                          or stat.S_IMODE(info.st_mode) != 0o700):
                      raise SystemExit('unsafe synthetic evidence directory')
                  step_env['HAMKAR_CI_EVIDENCE_OUTPUT'] = str(private_dir / target_name)
              print(f'::group::Synthetic private run step {executed + 1}', flush=True)
              # Launch a private process group. subprocess.run(timeout=...)
              # kills only the shell, potentially leaving child processes alive.
              # No private command text, output or exception goes to public logs.
              proc = subprocess.Popen(step['run'], cwd=root, shell=True,
                                      executable='/bin/bash', env=step_env,
                                      stdout=subprocess.DEVNULL,
                                      stderr=subprocess.DEVNULL,
                                      start_new_session=True)
              try:
                  proc.wait(timeout=limit * 60 if limit is not None else None)
              except subprocess.TimeoutExpired:
                  import signal
                  try:
                      os.killpg(proc.pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass
                  try:
                      proc.wait(timeout=2)
                  except subprocess.TimeoutExpired:
                      pass
                  # SIGTERM may be ignored by descendants even if the shell
                  # already exited. Reap/terminate the entire process group.
                  try:
                      os.killpg(proc.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  proc.wait()
                  raise SystemExit('nested workflow run step timed out') from None
              print('::endgroup::', flush=True)
              if proc.returncode:
                  raise SystemExit(proc.returncode)
              # GitHub does not replay GITHUB_ENV exports between nested
              # run steps executed as subprocesses of this one proxy step.
              # Import only the six non-secret, documented path exports.
              # Apply only bytes appended by this simulated step, not old
              # runner exports. Restrict exports to six local, non-secret paths.
              if github_env_path.is_symlink():
                  raise SystemExit('unsafe nested workflow env file')
              if github_env_path.is_file():
                  current_size = github_env_path.stat().st_size
                  if current_size < env_offset:
                      raise SystemExit('nested workflow env file was truncated')
                  with github_env_path.open('rb') as exports:
                      exports.seek(env_offset)
                      appended = exports.read(8193)
                  if len(appended) > 8192:
                      raise SystemExit('oversized nested workflow env export')
                  env_offset = current_size
                  allowed = {'HAMKAR_PG_DUMP_BIN', 'HAMKAR_PG_RESTORE_BIN',
                             'HAMKAR_TEST_BROWSER', 'HAMKAR_TEST_REACT',
                             'HAMKAR_TEST_REACT_DOM', 'HAMKAR_TEST_UI_ARTIFACTS'}
                  for assignment in appended.decode('utf-8').splitlines():
                      if not assignment:
                          continue
                      key, separator, value = assignment.partition('=')
                      if not separator or key not in allowed:
                          raise SystemExit('unrecognized nested workflow env export')
                      if (len(value) > 4096 or
                              not re.fullmatch(r'/[A-Za-z0-9_./-]+', value)):
                          raise SystemExit('unsafe nested workflow env path')
                      resolved = Path(value).resolve()
                      if key == 'HAMKAR_TEST_BROWSER':
                          if value != '/usr/bin/google-chrome':
                              raise SystemExit('unexpected browser binary path')
                      else:
                          temp_root = Path(env['RUNNER_TEMP']).resolve()
                          if not resolved.is_relative_to(temp_root):
                              raise SystemExit('nested workflow path escapes runner temp')
                          # Reject all symlinks, including directory components
                          # that resolve to another path still inside runner temp.
                          candidate = Path(value)
                          try:
                              relative = candidate.relative_to(Path(env['RUNNER_TEMP']))
                          except ValueError:
                              raise SystemExit('nested workflow path escapes runner temp') from None
                          cursor = Path(env['RUNNER_TEMP'])
                          for component in relative.parts:
                              if component in ('.', '..'):
                                  raise SystemExit('invalid runner temp path component')
                              cursor = cursor / component
                              if cursor.is_symlink():
                                  raise SystemExit('symlink in nested workflow export path')
                      env[key] = str(resolved)
              executed += 1
          print(f'HAMKAR_PROXY_JOB_DONE job={job_name} executed_run_steps={executed} skipped_non_run_steps={skipped}', flush=True)
          PY
          python "$RUNNER_TEMP/run_private_workflow_job.py"

