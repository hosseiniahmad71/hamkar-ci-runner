name: Security regression tests (public code only)

on:
  push:
    branches:
      - work/security-manual-proxy-no-public-artifacts-v1

permissions:
  contents: read

jobs:
  ci-helper-security-contract:
    name: Public helper guard and negative-input tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public helper only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python test runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install public YAML parser
        run: python -m pip install --retries 0 --timeout 10 'PyYAML>=6,<7'
      - name: Run adversarial security regressions
        run: python -m unittest discover -s tests -p 'test_ci_helper_security.py' -v
