name: HamKar standalone Settings Test and Review - exact source build
on:
  push:
    branches:
      - ci/settings-review-20261027
permissions:
  contents: read
jobs:
  independent-settings-review:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      TARGET_SHA: 5ec0f41e8697e7409181d6106dcc73e593d26964
    steps:
      - name: Read private immutable source only
        uses: actions/checkout@v4
        with:
          repository: hosseiniahmad71/Hamkar-erp
          ref: 5ec0f41e8697e7409181d6106dcc73e593d26964
          token: ${{ secrets.HAMKAR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: hamkar
      - name: Verify pinned source and remove private remote
        run: |
          set -euo pipefail
          test "$(git -C hamkar rev-parse HEAD)" = "$TARGET_SHA"
          git -C hamkar remote remove origin
          echo "VERIFIED_SOURCE_SHA=$TARGET_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hamkar/prototypes/mobile-workbench-v4/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        working-directory: hamkar/prototypes/mobile-workbench-v4
        run: npm ci --no-audit --no-fund
      - name: Run independent settings and old cache inspector regression tests
        working-directory: hamkar/prototypes/mobile-workbench-v4
        run: npx vitest run src/catalog/SettingsReview.test.tsx src/marketplace/DigikalaReadOnlyLab.test.tsx
      - name: Exact SHA full frontend build
        working-directory: hamkar/prototypes/mobile-workbench-v4
        run: python3 scripts/build-phone-web.py --source-sha "$TARGET_SHA"
      - name: Verify phone assets, manifest and separate Settings route
        working-directory: hamkar/prototypes/mobile-workbench-v4
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,tarfile,runpy,os
          root=pathlib.Path.cwd()
          doc=json.loads((root/'phone-web.json').read_text())
          assert doc['build_source_sha']==os.environ['TARGET_SHA']
          assert doc['scope']=='ISOLATED_PREVIEW'
          build=runpy.run_path('scripts/build-phone-web.py')
          assert doc['inputs']=={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in build['inputs'](root)}
          archive=root/'phone-web.tar.gz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==doc['archive_sha256']
          with tarfile.open(archive,'r:gz') as handle:
            members=handle.getmembers()
            assert len(members)==len(doc['files'])
            assert {m.name for m in members}==set(doc['files'])
            for member in members:
              assert member.isfile() and not member.issym() and not member.islnk()
              assert hashlib.sha256(handle.extractfile(member).read()).hexdigest()==doc['files'][member.name]
          assets=list((root/'dist/assets').glob('*.js'))
          assert any('تست و بررسی'.encode() in p.read_bytes() for p in assets), 'Missing Settings entrypoint in built scripts'
          print('VERIFIED: exact SHA, Settings entrypoint, archive and hashes')
          PY
      - name: Publish CI-only preview package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamkar-settings-review-${{ env.TARGET_SHA }}
          path: |
            hamkar/prototypes/mobile-workbench-v4/phone-web.json
            hamkar/prototypes/mobile-workbench-v4/phone-web.tar.gz
          retention-days: 7
          if-no-files-found: error
